<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Decorative Abstract Circles -->
  <circle cx="680" cy="100" r="160" fill="url(#glowGrad)"/>
  <circle cx="120" cy="360" r="140" fill="url(#glowGrad)"/>

  <!-- Center Card Graphic -->
  <g transform="translate(400, 190)">
    <!-- Icon Container -->
    <rect x="-48" y="-55" width="96" height="96" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Briefcase / Sparkle Icon -->
    <path d="M -16 -23 C -16 -27 -13 -30 -9 -30 L 9 -30 C 13 -30 16 -27 16 -23 L 16 -18 L 22 -18 C 25 -18 28 -15 28 -12 L 28 8 C 28 11 25 14 22 14 L -22 14 C -25 14 -28 11 -28 8 L -28 -12 C -28 -15 -25 -18 -22 -18 L -16 -18 Z M -11 -18 L 11 -18 L 11 -23 C 11 -25 10 -26 9 -26 L -9 -26 C -10 -26 -11 -25 -11 -23 Z" fill="#a5b4fc"/>
    <circle cx="18" cy="-28" r="3" fill="#38bdf8"/>
    <circle cx="-20" cy="18" r="2.5" fill="#f472b6"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="285" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">Professional Freelance Service</text>
  <text x="400" y="315" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Verified Quality &bull; Fast Delivery</text>

  <!-- Top Badge -->
  <g transform="translate(40, 40)">
    <rect width="110" height="32" rx="16" fill="#4f46e5" fill-opacity="0.6" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="55" y="21" text-anchor="middle" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">WORKLANCE</text>
  </g>
</svg>
